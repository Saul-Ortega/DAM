name: Integración Continua Java
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
defaults:
  run:
    working-directory: DPL - Despliegue de Aplicaciones/TEMA 4 - Repositorios y control de versiones/Actividad_1
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - run: mvn test
